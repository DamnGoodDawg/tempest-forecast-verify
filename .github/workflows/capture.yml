# .github/workflows/capture.yml — daily forecast capture + scoring
# Repo secrets required: TEMPEST_TOKEN, TEMPEST_STATION_ID
name: daily-forecast-capture
on:
  schedule:
    # 11:23 UTC: off the congested top-of-hour (observed drift 1.2-3.8 h past 11:00), and
    # after the Mac publishes the 05:35 ET house-AI forecast. = 07:23 EDT / 06:23 EST.
    # (Was 10:23 UTC. A punctual winter run at 05:23 EST would beat Dawg's 05:35 call to the
    # gist every day and fetch yesterday's file — which capture.py's freshness gate then
    # correctly refuses, losing the row. One hour later clears the call in both halves of
    # the year while staying well inside the same morning.)
    - cron: "23 11 * * *"
  workflow_dispatch: {}     # manual trigger for testing
concurrency:
  group: capture            # never let two capture runs race the same data/ + scores.json push
jobs:
  capture:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # Core capture. Fails LOUD (exit 1) if the irreplaceable Tempest snapshot is missed,
      # but the commit step below still runs so whatever WAS captured is never lost.
      - name: Capture forecasts
        env:
          TEMPEST_TOKEN: ${{ secrets.TEMPEST_TOKEN }}
          TEMPEST_STATION_ID: ${{ secrets.TEMPEST_STATION_ID }}
        run: python capture.py

      # Parser/scoring smoke tests (NWS attribution, missing-field tolerance, unit
      # conversions, NaN guard, DM). The API's documented failure mode is silently dropping
      # fields — this is the insurance. Runs even if capture failed; a red test blocks scoring.
      - name: Run tests
        if: always()
        run: python -m unittest test_extract test_health

      # Re-score from all snapshots into scores.json. Runs even if capture failed, so the
      # dashboard reflects the latest scorable data. extract.py never crashes the run.
      - name: Extract scores
        if: always()
        run: python extract.py

      # Station-health monitor: compare Tempest daily aggregates vs the 3 verified anchors,
      # emit health.json + anchors.csv, maintain the flag log. Never crashes the run.
      - name: Compute station health
        if: always()
        run: python health.py

      # Send the one-per-flag warning email (only if health.py queued a NEW flag). No-ops
      # cleanly when there's nothing pending or the Gmail secrets aren't configured.
      - name: Send station-health warning email
        if: always()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python notify.py

      - name: Commit snapshots + scores
        if: always()
        run: |
          git config user.name "forecast-capture-bot"
          git config user.email "actions@github.com"
          git add data/ scores.json health.json anchors.csv health_state.json anchors_backfill.json history/ verdict_history.json
          git add health_emailed.json 2>/dev/null || true   # only exists after the first warning email
          git commit -m "capture $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase --autostash || true
          git push
